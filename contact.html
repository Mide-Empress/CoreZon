    <section id="contact">
        <div class="container">
            <h2>Contact Us</h2>
            <p>If you have any questions or need assistance, 
            feel free to get in touch with us. We're here to help!</p>

            <form action="#" method="POST" id="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" required placeholder="Enter your message" rows="5"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>

            <div class="contact-details">
                <h3>Our Contact Information</h3>
                <p><strong>Email:</strong> support@corezen.com</p>
                <p><strong>Phone:</strong> +234 70 160 615 84</p>
                <p><strong>Address:</strong> 123 CoreZen Street, Tech City, 10001</p>
            </div>


            <div class="map-container">
                <h3>Find Us Here</h3>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d243647.76476040947!2d-74.005941!3d40.712776!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDDCsDU3JzA0LjQiTiA3NMKwMDcnMjguMSJ!5e0!3m2!1sen!2sus!4v1649446297070"
                 width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </section>
</body>
</html>
